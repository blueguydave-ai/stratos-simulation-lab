<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRATOS engine tests</title></head>
<body style="font:16px system-ui;max-width:900px;margin:40px auto;padding:0 18px"><h1>STRATOS simulation engine checks</h1><p>These are deterministic contract tests, not evidence that the model predicts real people or markets.</p><pre id="results">Running…</pre>
<script src="../src/core/model.js"></script><script src="../src/engines/simulation.js"></script><script>
const out=[];function test(name,fn){try{if(fn()!==true)throw Error("Assertion returned false");out.push("PASS  "+name)}catch(e){out.push("FAIL  "+name+" — "+e.message)}}
const m=STRATOSCore.freshModel();m.variables=[{id:"v1",name:"Demand",level:5,low:2,high:8,importance:8,direction:"positive",confidence:"high",evidenceStatus:"estimated"},{id:"v2",name:"Revenue",level:5,low:2,high:8,importance:9,direction:"positive",confidence:"medium",evidenceStatus:"assumption"}];m.links=[{id:"l1",from:"v1",to:"v2",sign:"positive",strength:2}];
test("same seed produces same state",()=>JSON.stringify(STRATOSSimulation.simulate(m,{seed:"repeat"}).finalLevels)===JSON.stringify(STRATOSSimulation.simulate(m,{seed:"repeat"}).finalLevels));
test("different seed does not corrupt model state",()=>{STRATOSSimulation.simulate(m,{seed:"a"});return m.variables[0].level===5&&m.variables[1].level===5});
test("strategy direct effects are applied",()=>{m.decisions=[{id:"d1",name:"Improve demand",effectText:"v1:+2"}];return STRATOSSimulation.simulate(m,{decisionId:"d1",seed:"strategy"}).finalLevels.v1>5});
test("confirmed event applies at its scheduled step",()=>{m.events=[{id:"e1",name:"Confirmed event",when:2,status:"confirmed",likelihood:"unknown",effects:{v1:2}}];const r=STRATOSSimulation.simulate(m,{steps:3,seed:"event"});return r.timeline[0].levels.v1===5&&r.timeline[1].levels.v1>5});
test("unknown events can be excluded",()=>{m.events=[{id:"e2",name:"Unknown",when:1,status:"possible",likelihood:"unknown",effects:{v1:2}}];return STRATOSSimulation.simulate(m,{seed:"excluded",includeUncertain:false}).finalLevels.v1===5});
test("delayed causal effects are reported",()=>{m.events=[];m.links=[{id:"l2",from:"v1",to:"v2",sign:"positive",strength:2,delay:2}];return STRATOSSimulation.simulate(m,{steps:3,seed:"delay"}).warnings.some(x=>x.includes("Delayed causal"))});
test("actor policy waits for its explicit trigger",()=>{m.events=[];m.links=[];m.decisions=[{id:"d1",name:"Trigger test",effectText:"v1:+2"}];m.actors=[{id:"a1",name:"Conditional actor",responseEffects:"v2:+2",responseChance:100,policy:"negotiate",triggerVariable:"v1",triggerOperator:"gte",triggerThreshold:7}];const r=STRATOSSimulation.simulate(m,{decisionId:"d1",steps:1,rounds:1,seed:"policy"});return r.actorResponses.length===1&&r.actorResponses[0].triggered===true&&r.actorResponses[0].responded===true;});
test("actor policy records a non-trigger without applying response",()=>{m.decisions=[{id:"d2",name:"No trigger",effectText:"v1:-2"}];m.actors=[{id:"a2",name:"Waiting actor",responseEffects:"v2:+2",responseChance:100,triggerVariable:"v1",triggerOperator:"gte",triggerThreshold:8}];const r=STRATOSSimulation.simulate(m,{decisionId:"d2",steps:1,rounds:1,seed:"no-trigger"});return r.actorResponses.length===1&&r.actorResponses[0].triggered===false&&!r.actorResponses[0].responded;});
test("delayed link is scheduled once per step, not per propagation round",()=>{m.actors=[];m.decisions=[];m.variables[0].level=7;m.links=[{id:"delay-once",from:"v1",to:"v2",sign:"positive",strength:2,delay:1}];const one=STRATOSSimulation.simulate(m,{steps:2,rounds:1,seed:"delay-once"});const many=STRATOSSimulation.simulate(m,{steps:2,rounds:5,seed:"delay-once"});return Math.abs(one.timeline[1].levels.v2-many.timeline[1].levels.v2)<0.0001;});
test("goal alignment and incentives increase response propensity",()=>{m.decisions=[{id:"d3",name:"Aligned strategy",effectText:"v1:+2"}];m.actors=[{id:"a3",name:"Aligned actor",responseEffects:"v2:+1",responseChance:40,goalAlignment:5,incentivePressure:10,resourceCapacity:10,perceivedRisk:0,riskTolerance:10,informationConfidence:10}];const o=STRATOSSimulation.simulate(m,{decisionId:"d3",steps:1,seed:"drivers"}).actorResponses[0];return o.baseProbability===0.4&&o.probability>o.baseProbability&&o.modifiers.goalAlignment>0&&o.modifiers.incentivePressure>0;});
test("perceived risk above risk tolerance lowers response propensity",()=>{m.actors=[{id:"a4",name:"Risk-averse actor",responseEffects:"v2:+1",responseChance:60,riskTolerance:1,perceivedRisk:10}];const o=STRATOSSimulation.simulate(m,{decisionId:"d3",steps:1,seed:"risk"}).actorResponses[0];return o.probability<o.baseProbability&&o.modifiers.perceivedRisk<0;});
test("adjusted response propensity is bounded",()=>{m.actors=[{id:"a5",name:"Bounded actor",responseEffects:"v2:+1",responseChance:99,goalAlignment:5,incentivePressure:10,resourceCapacity:10,riskTolerance:10,perceivedRisk:0,informationConfidence:10}];const o=STRATOSSimulation.simulate(m,{decisionId:"d3",steps:1,seed:"bounded"}).actorResponses[0];return o.probability<=1&&o.probability>=0;});
test("actor beliefs learn gradually from observable state",()=>{m.actors=[{id:"learner",name:"Learner",beliefs:"Demand:2",informationAccess:"Demand",learningRate:0.5,informationConfidence:10}];m.variables[0].level=8;m.variables[1].level=5;m.links=[];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"belief-learn"});return r.beliefTimeline[0].actors[0].beliefs.v1===5;});
test("restricted information prevents belief updates",()=>{m.actors=[{id:"restricted",name:"Restricted",beliefs:"Demand:2",informationAccess:"Revenue",learningRate:1,informationConfidence:10}];m.variables[0].level=8;m.links=[];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"belief-access"});return r.beliefTimeline[0].actors[0].beliefs.v1===2;});
test("actor trigger evaluates actor belief rather than actual state",()=>{m.decisions=[{id:"d-belief",name:"Belief trigger",effectText:""}];m.actors=[{id:"belief-trigger",name:"Belief trigger actor",beliefs:"Demand:2",informationAccess:"Revenue",learningRate:0,responseEffects:"Revenue:+2",responseChance:100,triggerVariable:"v1",triggerOperator:"gte",triggerThreshold:7}];m.variables[0].level=9;m.links=[];const r=STRATOSSimulation.simulate(m,{decisionId:"d-belief",steps:1,seed:"belief-trigger"});return r.actorResponses[0].triggered===false;});
test("accurate message moves recipient belief toward the claim",()=>{m.actors=[{id:"sender",name:"Sender"},{id:"receiver",name:"Receiver",beliefs:"Demand:2",informationAccess:"Demand",learningRate:1,informationConfidence:10}];m.communications=[{id:"msg1",name:"Market update",senderId:"sender",recipientId:"receiver",when:1,variableId:"v1",claimedValue:8,credibility:10,accuracy:"accurate"}];m.variables[0].level=5;m.links=[];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"message-accurate"});return r.communications[0].delivered&&r.communications[0].after===8;});
test("misleading message can move beliefs away from actual state",()=>{m.actors=[{id:"receiver",name:"Receiver",beliefs:"Demand:5",informationAccess:"Demand",learningRate:1,informationConfidence:10}];m.communications=[{id:"msg2",recipientId:"receiver",when:1,variableId:"v1",claimedValue:1,credibility:10,accuracy:"misleading"}];m.variables[0].level=9;m.links=[];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"message-misleading"});return r.communications[0].after<5;});
test("recipient without information access does not receive message",()=>{m.actors=[{id:"receiver",name:"Receiver",beliefs:"Demand:2",informationAccess:"Revenue",learningRate:1,informationConfidence:10}];m.communications=[{id:"msg3",recipientId:"receiver",when:1,variableId:"v1",claimedValue:9,credibility:10,accuracy:"accurate"}];m.variables[0].level=5;m.links=[];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"message-blocked"});return r.communications[0].delivered===false&&r.beliefTimeline[0].actors[0].beliefs.v1===2;});
test("trusted sender has greater influence than distrusted sender",()=>{m.actors=[{id:"s1",name:"Trusted"},{id:"s2",name:"Distrusted"},{id:"r",name:"Recipient",beliefs:"Demand:2",informationAccess:"Demand",learningRate:1,informationConfidence:10}];m.relationships=[{id:"rel1",fromActorId:"s1",toActorId:"r",trust:10,respect:5},{id:"rel2",fromActorId:"s2",toActorId:"r",trust:0,respect:5}];m.communications=[{id:"c1",senderId:"s1",recipientId:"r",when:1,variableId:"v1",claimedValue:9,credibility:10,accuracy:"accurate"},{id:"c2",senderId:"s2",recipientId:"r",when:1,variableId:"v1",claimedValue:9,credibility:10,accuracy:"accurate"}];m.links=[];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"trust-influence"});return r.communications[0].influence>r.communications[1].influence;});
test("accurate and misleading messages update directional trust differently",()=>{m.actors=[{id:"s",name:"Sender"},{id:"r",name:"Receiver",informationAccess:"Demand",learningRate:0,informationConfidence:10}];m.relationships=[{id:"rel",fromActorId:"s",toActorId:"r",trust:5,respect:5}];m.communications=[{id:"good",senderId:"s",recipientId:"r",when:1,variableId:"v1",claimedValue:5,credibility:5,accuracy:"accurate"},{id:"bad",senderId:"s",recipientId:"r",when:1,variableId:"v1",claimedValue:5,credibility:5,accuracy:"misleading"}];m.links=[];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"trust-history"});return r.relationships.length===2&&r.relationships[0].trustAfter>r.relationships[0].trustBefore&&r.relationships[1].trustAfter<r.relationships[1].trustBefore;});
test("relationship direction is respected",()=>{m.actors=[{id:"a",name:"A"},{id:"b",name:"B",beliefs:"Demand:1",informationAccess:"Demand",learningRate:1,informationConfidence:10}];m.relationships=[{id:"ab",fromActorId:"b",toActorId:"a",trust:10,respect:10}];m.communications=[{id:"m",senderId:"a",recipientId:"b",when:1,variableId:"v1",claimedValue:9,credibility:10,accuracy:"accurate"}];m.links=[];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"direction"});return r.communications[0].relationshipFactor===0.75;});
test("simulation does not mutate saved relationship assumptions",()=>{m.actors=[{id:"s",name:"Sender"},{id:"r",name:"Receiver",informationAccess:"Demand",learningRate:0,informationConfidence:10}];m.relationships=[{id:"rel",fromActorId:"s",toActorId:"r",trust:5,respect:5}];m.communications=[{id:"c",senderId:"s",recipientId:"r",when:1,variableId:"v1",claimedValue:5,credibility:5,accuracy:"accurate"}];m.links=[];STRATOSSimulation.simulate(m,{steps:1,seed:"no-mutation"});return m.relationships[0].trust===5;});
test("group action applies effects when support threshold and coordination succeed",()=>{m.groups=[{id:"g",name:"Coalition",memberIds:"a,b",supportLevel:100,decisionThreshold:50,cohesion:10,coordination:10,conformityPressure:10,when:1,effects:"Demand:+2"}];m.actors=[{id:"a",name:"A"},{id:"b",name:"B"}];m.links=[];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"group-action"});return r.groups[0].acted&&r.finalLevels.v1>5;});
test("group action is blocked below support threshold",()=>{m.groups=[{id:"g",name:"Divided group",supportLevel:20,decisionThreshold:60,cohesion:8,coordination:10,when:1,effects:"Demand:+2"}];m.actors=[];m.links=[];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"group-block"});return !r.groups[0].acted&&r.groups[0].reason==="Support below decision threshold"&&r.finalLevels.v1===5;});
test("group trigger can defer collective action",()=>{m.groups=[{id:"g",name:"Conditional group",supportLevel:100,decisionThreshold:50,cohesion:10,coordination:10,when:1,triggerVariable:"v1",triggerOperator:"gt",triggerThreshold:9,effects:"Demand:+2"}];m.actors=[];m.links=[];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"group-trigger"});return !r.groups[0].triggered&&!r.groups[0].acted;});
test("same seed reproduces group action outcome",()=>{m.groups=[{id:"g",name:"Repeat group",supportLevel:80,decisionThreshold:40,cohesion:7,coordination:6,when:1,effects:"Demand:+1"}];m.actors=[];m.links=[];const x=STRATOSSimulation.simulate(m,{steps:1,seed:"group-repeat"}),y=STRATOSSimulation.simulate(m,{steps:1,seed:"group-repeat"});return JSON.stringify(x.groups)===JSON.stringify(y.groups)&&JSON.stringify(x.finalLevels)===JSON.stringify(y.finalLevels);});
test("power leverage raises response propensity only for the dependent actor",()=>{m.decisions=[{id:"d-power",name:"Holder strategy",actorId:"holder",effectText:""}];m.actors=[{id:"holder",name:"Holder"},{id:"dependent",name:"Dependent",responseEffects:"Demand:+1",responseChance:40},{id:"outsider",name:"Outsider",responseEffects:"Demand:+1",responseChance:40}];m.powerRelations=[{id:"p1",holderActorId:"holder",dependentActorId:"dependent",leverage:10,dependency:10,legitimacy:10,effect:"mobilize"}];m.links=[];const r=STRATOSSimulation.simulate(m,{decisionId:"d-power",steps:1,seed:"power-leverage"});const dependent=r.actorResponses.find(x=>x.actorId==="dependent"),outsider=r.actorResponses.find(x=>x.actorId==="outsider");return dependent.probability>dependent.baseProbability&&outsider.probability===outsider.baseProbability&&dependent.powerModifier>0;});
test("power relations are directional",()=>{m.decisions=[{id:"d-reverse",name:"Reverse strategy",actorId:"dependent",effectText:""}];m.actors=[{id:"holder",name:"Holder"},{id:"dependent",name:"Dependent",responseEffects:"Demand:+1",responseChance:40}];m.powerRelations=[{id:"p2",holderActorId:"holder",dependentActorId:"dependent",leverage:10,dependency:10,legitimacy:10,effect:"mobilize"}];const r=STRATOSSimulation.simulate(m,{decisionId:"d-reverse",steps:1,seed:"power-direction"});return r.actorResponses[0].powerModifier===0;});
test("inactive power relation has no influence",()=>{m.decisions=[{id:"d-inactive",name:"Inactive strategy",actorId:"holder",effectText:""}];m.actors=[{id:"holder",name:"Holder"},{id:"dependent",name:"Dependent",responseEffects:"Demand:+1",responseChance:40}];m.powerRelations=[{id:"p3",holderActorId:"holder",dependentActorId:"dependent",leverage:10,dependency:10,legitimacy:10,effect:"mobilize",active:false}];const r=STRATOSSimulation.simulate(m,{decisionId:"d-inactive",steps:1,seed:"power-inactive"});return r.actorResponses[0].powerModifier===0;});
test("discouraging leverage reduces response propensity",()=>{m.decisions=[{id:"d-discourage",name:"Discouraged strategy",actorId:"holder",effectText:""}];m.actors=[{id:"holder",name:"Holder"},{id:"dependent",name:"Dependent",responseEffects:"Demand:+1",responseChance:60}];m.powerRelations=[{id:"p4",holderActorId:"holder",dependentActorId:"dependent",leverage:10,dependency:10,legitimacy:10,effect:"discourage"}];const r=STRATOSSimulation.simulate(m,{decisionId:"d-discourage",steps:1,seed:"power-discourage"});return r.actorResponses[0].probability<r.actorResponses[0].baseProbability;});
test("institutional rule applies explicit variable effects at its start step",()=>{m.institutions=[{id:"i1",name:"Permit requirement",when:2,effects:"Demand:-2",severity:8,enforcement:8,responseEffect:"restrict"}];const r=STRATOSSimulation.simulate(m,{steps:3,seed:"institution-step"});return r.timeline[0].levels.v1===5&&r.timeline[1].levels.v1<5&&r.institutions.some(x=>x.id==="i1"&&x.reason==="Rule activated");});
test("institutional activation trigger can prevent rule effects",()=>{m.institutions=[{id:"i2",name:"Conditional rule",when:1,triggerVariable:"v1",triggerOperator:"gte",triggerThreshold:9,effects:"Demand:-2"}];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"institution-trigger"});return r.finalLevels.v1===5&&r.institutions[0].reason==="Trigger condition not met";});
test("institutional response restriction affects only targeted actor",()=>{m.decisions=[{id:"d-inst",name:"Policy response",actorId:"holder",effectText:""}];m.actors=[{id:"holder",name:"Holder"},{id:"target",name:"Target",responseEffects:"Demand:+1",responseChance:60},{id:"other",name:"Other",responseEffects:"Demand:+1",responseChance:60}];m.institutions=[{id:"i3",name:"Permit barrier",when:1,actorIds:"target",severity:10,enforcement:10,responseEffect:"restrict"}];const r=STRATOSSimulation.simulate(m,{decisionId:"d-inst",steps:1,seed:"institution-target"});const target=r.actorResponses.find(x=>x.actorId==="target"),other=r.actorResponses.find(x=>x.actorId==="other");return target.probability<target.baseProbability&&other.probability===other.baseProbability;});
test("institutional rules do not mutate saved model assumptions",()=>{m.institutions=[{id:"i4",name:"Temporary cap",when:1,effects:"Demand:-1"}];STRATOSSimulation.simulate(m,{steps:1,seed:"institution-copy"});return m.variables[0].level===5&&m.institutions[0].effects==="Demand:-1";});
test("market snapshot applies a bounded demand and revenue effect",()=>{m.actors=[];m.decisions=[];m.links=[];m.institutions=[];m.markets=[{id:"market1",name:"Reference market",when:1,priceIndex:5,purchasingPower:5,priceSensitivity:5,competition:0,substitutes:0,saturation:0,capacity:10,demandVariableId:"v1",revenueVariableId:"v2"}];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"market-base"});return r.markets.length===1&&r.markets[0].salesFactor===1&&r.finalLevels.v1===5&&r.finalLevels.v2===5;});
test("higher price above purchasing power reduces demand more when sensitivity is high",()=>{m.markets=[{id:"low",when:1,priceIndex:9,purchasingPower:5,priceSensitivity:2,competition:0,substitutes:0,saturation:0,capacity:10,demandVariableId:"v1"},{id:"high",when:1,priceIndex:9,purchasingPower:5,priceSensitivity:10,competition:0,substitutes:0,saturation:0,capacity:10,demandVariableId:"v2"}];m.variables[0].level=5;m.variables[1].level=5;const r=STRATOSSimulation.simulate(m,{steps:1,seed:"market-elasticity"});return r.markets[1].priceFactor<r.markets[0].priceFactor&&r.finalLevels.v2<r.finalLevels.v1;});
test("competition and substitutes reduce demand potential",()=>{m.markets=[{id:"open",when:1,priceIndex:5,purchasingPower:5,priceSensitivity:5,competition:0,substitutes:0,saturation:0,capacity:10},{id:"crowded",when:1,priceIndex:5,purchasingPower:5,priceSensitivity:5,competition:10,substitutes:10,saturation:0,capacity:10}];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"market-rivals"});return r.markets[1].demandPotential<r.markets[0].demandPotential;});
test("saturation reduces potential growth",()=>{m.markets=[{id:"fresh",when:1,priceIndex:5,purchasingPower:5,priceSensitivity:0,competition:0,substitutes:0,saturation:0,capacity:10},{id:"mature",when:1,priceIndex:5,purchasingPower:5,priceSensitivity:0,competition:0,substitutes:0,saturation:10,capacity:10}];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"market-saturation"});return r.markets[1].saturationFactor<r.markets[0].saturationFactor&&r.markets[1].demandPotential<r.markets[0].demandPotential;});
test("supply capacity caps sales below potential demand",()=>{m.markets=[{id:"unlimited",when:1,priceIndex:2,purchasingPower:8,priceSensitivity:10,competition:0,substitutes:0,saturation:0,capacity:10},{id:"constrained",when:1,priceIndex:2,purchasingPower:8,priceSensitivity:10,competition:0,substitutes:0,saturation:0,capacity:2}];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"market-capacity"});return r.markets[1].salesFactor<r.markets[1].demandPotential&&r.markets[1].salesFactor<r.markets[0].salesFactor;});
test("market with missing variable links reports outcome without crashing",()=>{m.markets=[{id:"unlinked",name:"Unlinked market",when:1,priceIndex:5,purchasingPower:5,capacity:5}];const r=STRATOSSimulation.simulate(m,{steps:1,seed:"market-unlinked"});return r.markets[0].reason==="No linked demand or revenue variable"&&r.finalLevels.v1===5;});
test("market assumptions are applied only at their scheduled step and do not mutate model",()=>{m.variables[0].level=5;m.markets=[{id:"delayed-market",when:2,priceIndex:10,purchasingPower:0,priceSensitivity:10,competition:10,substitutes:10,saturation:10,capacity:1,demandVariableId:"v1"}];const before=JSON.stringify(m.markets);const r=STRATOSSimulation.simulate(m,{steps:2,seed:"market-schedule"});return r.timeline[0].levels.v1===5&&r.timeline[1].levels.v1<5&&JSON.stringify(m.markets)===before;});
document.querySelector("#results").textContent=out.join("\n")+"\n\n"+out.filter(x=>x.startsWith("PASS")).length+"/"+out.length+" checks passed.";
</script></body></html>
