<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRATOS guided simulation tests</title></head>
<body style="font:16px system-ui;max-width:850px;margin:40px auto;padding:0 18px">
<h1>STRATOS guided simulation checks</h1><p>These checks cover local recommendations and model-readiness logic. They do not validate real-world predictive accuracy.</p><pre id="results">Running…</pre>
<script src="../src/core/model.js"></script><script src="../src/core/guidance.js"></script>
<script>
const out=[];function test(name,fn){try{if(fn()!==true)throw Error("Assertion returned false");out.push("PASS  "+name)}catch(e){out.push("FAIL  "+name+" — "+e.message)}}
const m=STRATOSCore.freshModel();
test("empty model recommends defining situation and outcome",()=>{const r=STRATOSGuidance.analyze(m);return r.suggestions.some(x=>x.id==="situation")&&r.suggestions.some(x=>x.id==="outcome")});
test("missing actors and variables are identified, then links are suggested after variables exist",()=>{const ids=STRATOSGuidance.analyze(m).suggestions.map(x=>x.id);m.variables=[{id:"v"}];const next=STRATOSGuidance.analyze(m).suggestions.map(x=>x.id);return ids.includes("actors")&&ids.includes("variables")&&next.includes("causal-links")});
test("business domain recommends market, segments and buyer journey",()=>{m.meta.domainPack="business";const ids=STRATOSGuidance.analyze(m).suggestions.map(x=>x.id);return ids.includes("market")&&ids.includes("segments")&&ids.includes("journey")});
test("institutional domain recommends rule and constraint modelling",()=>{m.meta.domainPack="institution";return STRATOSGuidance.analyze(m).suggestions.some(x=>x.id==="institutions")});
test("cross-cultural domain prompts for sourced local variation",()=>{m.meta.domainPack="cross-cultural";return STRATOSGuidance.analyze(m).suggestions.some(x=>x.id==="cultural-context")&&STRATOSGuidance.analyze(m).questions.some(x=>x.includes("subgroup"))});
test("decision question is preserved in report",()=>{m.situation.simulationQuestion="Which option should I test?";return STRATOSGuidance.analyze(m).question==="Which option should I test?"});
test("task wording adds relevant buyer-path suggestions",()=>{m.situation.simulationQuestion="How can I sell more to customers?";return STRATOSGuidance.analyze(m).suggestions.some(x=>x.id==="task-buyer-path")});
test("readiness is bounded and empty model is not marked complete",()=>{m.situation={};m.meta.domainPack="general";const r=STRATOSGuidance.analyze(m);return r.readiness>=0&&r.readiness<=100&&r.readiness<100});
test("complete structural checklist reaches 100 percent",()=>{m.situation={outcome:"Target",boundary:"Scope",timeHorizon:"30 days",description:"Case"};m.actors=[{id:"a",goals:"g",constraints:"c",information:"i"}];m.variables=[{id:"v1"},{id:"v2"},{id:"v3"},{id:"v4"},{id:"v5"}];m.links=[{id:"l"}];m.decisions=[{id:"d"}];m.events=[{id:"e"}];m.evidence=[{id:"x"}];m.experiments=[{id:"t"}];return STRATOSGuidance.analyze(m).readiness===100});
test("analysis does not mutate the supplied model",()=>{const before=JSON.stringify(m);STRATOSGuidance.analyze(m);return JSON.stringify(m)===before});
test("guidance identifies missing constraints resources and prerequisites",()=>{const r=STRATOSGuidance.analyze(STRATOSCore.freshModel());return r.suggestions.some(x=>x.id==="system-dynamics"&&x.view==="intelligence")&&r.checks.some(x=>x[0].includes("Constraints"));});
test("guidance respects explicit no-additional-dynamics review",()=>{const m=STRATOSCore.freshModel();m.situation.dynamicsReviewed=true;return !STRATOSGuidance.analyze(m).suggestions.some(x=>x.id==="system-dynamics");});
document.querySelector("#results").textContent=out.join("\n")+"\n\n"+out.filter(x=>x.startsWith("PASS")).length+"/"+out.length+" checks passed.";
</script></body></html>
